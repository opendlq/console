<div class="page">
  <odlq-page-header [title]="name()" [crumbs]="[{ label: 'Topics' }]" (crumbSelect)="router.navigateByUrl('/topics')">
    <button actions odlq-button variant="outline" (click)="store.query.set('')">Reset</button>
  </odlq-page-header>

  <odlq-kpi-row>
    <odlq-kpi-card label="Dead letters" [value]="topic()?.deadLetters ?? 0" />
    <odlq-kpi-card label="Parked" [value]="store.parked()" tone="danger" hint="needs manual action" />
    <odlq-kpi-card label="Retrying" [value]="store.retrying()" tone="warning" />
    <odlq-kpi-card label="Resolved" [value]="store.resolved()" tone="success" />
  </odlq-kpi-row>

  <odlq-filter-bar
    [(query)]="store.query"
    [filters]="store.filters()"
    [templates]="[]"
    (addJsFilter)="jsOpen.set(true)"
    (filterRemoved)="store.removeFilter($event)"
    (clearAll)="store.clearFilters()"
  />
  <odlq-bulk-action-bar
    [count]="store.selection().length"
    (reprocess)="reprocessSelected()"
    (exportSelected)="exportSelected()"
    (discard)="discardOpen.set(true)"
    (cleared)="store.selection.set([])"
  />
  <odlq-message-table
    [messages]="store.visible()"
    [(selection)]="store.selection"
    [activeMessage]="store.active()"
    (messageClick)="store.active.set($event); detailOpen.set(true)"
  />
  <odlq-pagination [total]="store.visible().length" [pageSize]="50" />
</div>

<odlq-message-detail-drawer
  [(open)]="detailOpen"
  [message]="store.active()"
  placement="container"
  (reprocess)="detailOpen.set(false); reprocessOpen.set(true)"
/>
<odlq-reprocess-drawer
  [(open)]="reprocessOpen"
  [message]="store.active()"
  [topics]="targets()"
  placement="container"
  (reprocess)="reprocessOne($event)"
/>
<odlq-js-filter-drawer [(open)]="jsOpen" placement="container" (added)="store.addFilter($event)" />
<odlq-confirm-dialog
  [(open)]="discardOpen"
  heading="Discard messages"
  confirmLabel="Discard"
  [message]="'Discard ' + store.selection().length + ' message(s)? They are removed from this topic and cannot be reprocessed.'"
  (confirmed)="discard()"
/>
